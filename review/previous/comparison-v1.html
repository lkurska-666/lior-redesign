<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BYS · Compare concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;font-family:'JetBrains Mono',monospace;background:#101010;color:#f5f5f5}*{box-sizing:border-box}body{margin:0}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #dcc09c;outline-offset:4px}.review-header{padding:20px 28px;border-bottom:1px solid #383733;display:flex;align-items:center;gap:24px}.review-brand{font-size:14px;line-height:1.5;white-space:nowrap}.review-brand b{color:#dcc09c;display:block}.review-brand span{color:#aaa69f;font-size:12px}.concepts{display:flex;gap:6px}.concept{padding:10px 14px;background:transparent;border:1px solid #3b3935;text-align:left;line-height:1.5;font-size:12px}.concept strong{font-size:14px;font-weight:600}.concept[aria-pressed=true]{border-color:#dcc09c;background:#dcc09c;color:#171717}.devices{display:flex;gap:4px;margin-left:auto}.devices button{background:transparent;border:1px solid transparent;padding:10px 12px;font-size:12px;color:#aaa69f}.devices button[aria-pressed=true]{color:#f5f5f5;border-color:#646058}.open-page{font-size:12px;white-space:nowrap;color:#dcc09c}.review-meta{padding:12px 28px;display:flex;justify-content:space-between;gap:24px;font-size:12px;color:#96928b;border-bottom:1px solid #292823;line-height:1.6}.review-meta p{margin:0}.viewport-area{height:calc(100dvh - 145px);min-height:400px;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start;background:#101010}.viewport{height:100%;min-height:400px;flex-shrink:0;width:100%;max-width:1440px;border:0;outline:1px solid #383733;background:#171717;box-shadow:0 12px 32px #0004}iframe{width:100%;height:100%;border:0;display:block}.review-meta a{color:#dcc09c}@media(max-width:1100px){.review-header{flex-wrap:wrap;gap:16px}.review-brand{margin-right:auto}.concepts{order:4;width:100%}.concept{flex:1}.devices{margin-left:0}.viewport-area{height:calc(100dvh - 210px)}}@media(max-width:600px){.review-header{padding:16px;gap:12px}.review-brand span{display:none}.open-page{font-size:11px}.devices{gap:0}.devices button{padding:8px;font-size:11px}.concept{padding:8px;font-size:10px}.concept strong{font-size:12px;display:block}.review-meta{padding:12px 16px;font-size:11px;gap:12px}.review-meta .detail{display:none}.viewport-area{padding:12px 0;height:calc(100dvh - 193px)}.viewport{border-inline:0}.review-brand{font-size:12px}}
</style>
</head>
<body>
<header class="review-header"><div class="review-brand"><b>BUILD YOUR STORE</b><span>Visual concept review</span></div><nav class="concepts" aria-label="Visual concepts"><button class="concept" data-concept="a" aria-pressed="true"><strong>A</strong> Minimal Editorial</button><button class="concept" data-concept="b" aria-pressed="false"><strong>B</strong> Premium Product Showcase</button><button class="concept" data-concept="c" aria-pressed="false"><strong>C</strong> Bold Brutalist</button></nav><div class="devices" aria-label="Preview width"><button data-width="desktop" aria-pressed="true">Desktop</button><button data-width="768" aria-pressed="false">768px</button><button data-width="390" aria-pressed="false">390px</button></div><a class="open-page" id="open-page" href="concept-a.html" target="_blank" rel="noopener">Open page ↗</a></header>
<div class="review-meta"><p id="description">Portrait-led hero · quiet feature rows · restrained product framing</p><p class="detail">Same copy, CTAs & feature order</p></div>
<main class="viewport-area"><div class="viewport"><iframe id="preview" src="concept-a.html" title="Concept A — Minimal Editorial"></iframe></div></main>
<script>
const descriptions={a:'Portrait-led hero · quiet feature rows · restrained product framing',b:'Offset portrait · immersive store gallery · spacious, centered CTA',c:'Oversized type · asymmetric grid · deliberately cropped product visuals'};
const names={a:'Minimal Editorial',b:'Premium Product Showcase',c:'Bold Brutalist'};
const params=new URLSearchParams(location.search);let selected=['a','b','c'].includes(params.get('concept'))?params.get('concept'):'a';let size=['390','768'].includes(params.get('width'))?params.get('width'):'desktop';
function updateConcept(){document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.concept===selected));const preview=document.getElementById('preview');preview.src=`concept-${selected}.html`;preview.title=`Concept ${selected.toUpperCase()} — ${names[selected]}`;document.getElementById('open-page').href=preview.src;document.getElementById('description').textContent=descriptions[selected];save();}
function updateSize(){document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.width===size));const viewport=document.querySelector('.viewport');viewport.style.width=size==='desktop'?'100%':size+'px';viewport.style.maxWidth=size==='desktop'?'1440px':'none';document.querySelector('.viewport-area').style.justifyContent=size!=='desktop'&&Number(size)>innerWidth?'flex-start':'center';save();}
function save(){history.replaceState(null,'',`?concept=${selected}&width=${size}`)}
document.querySelectorAll('[data-concept]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.concept;updateConcept()}));document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{size=b.dataset.width;updateSize()}));addEventListener('resize',updateSize);updateConcept();updateSize();
</script>
</body></html>
